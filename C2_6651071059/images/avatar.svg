<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Anime avatar sinh vien lap trinh</title>
  <desc id="desc">Nhan vat anime toc den, ao hoodie den va tai nghe trong phong mau xanh tim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4d6"/>
      <stop offset="100%" stop-color="#d8a99f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".3"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="238"/>
    </clipPath>
  </defs>

  <circle cx="250" cy="250" r="246" fill="#0f172a"/>
